name: Update latest songs from DkRapria YouTube channel

on:
  schedule:
    # 8:00 AM India Standard Time (02:30 UTC), every day.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-songs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube extractor
        run: python -m pip install --upgrade yt-dlp
      - name: Fetch latest DkRapria channel releases
        run: python scripts/update_latest_songs.py
      - name: Commit updated song feed
        run: |
          if git diff --quiet -- latest-songs.json; then
            echo "No song feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-songs.json
          git commit -m "Update latest songs feed"
          git push
