name: Update latest songs from YouTube Music

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-songs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch latest Topic channel releases
        run: python3 scripts/update_latest_songs.py
      - name: Commit updated song feed
        run: |
          if git diff --quiet -- latest-songs.json; then
            echo "No song feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-songs.json
          git commit -m "Update latest songs feed"
          git push
