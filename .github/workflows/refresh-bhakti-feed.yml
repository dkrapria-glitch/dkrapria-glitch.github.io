name: Refresh SunoDk Bhakti Feed

on:
  schedule:
    # 8:00 AM India Standard Time (02:30 UTC), every day.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bhakti-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YouTube extractor
        run: python -m pip install --upgrade yt-dlp
      - name: Build latest devotional feed
        run: python scripts/update_latest_bhakti.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- latest-bhakti.json; then
            echo "No bhakti feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-bhakti.json
          git commit -m "Refresh latest SunoDk bhakti feed"
          git push
