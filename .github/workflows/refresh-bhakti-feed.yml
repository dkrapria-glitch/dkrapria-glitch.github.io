name: Refresh SunoDk Bhakti Feed
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build latest devotional feed
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, re, html
          channel = "UCokS_ORFCf6Ql_LBAFF1Ohg"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel}"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(data)
          ns = {"atom":"http://www.w3.org/2005/Atom","yt":"http://www.youtube.com/xml/schemas/2015"}
          terms = re.compile(r"bhakti|bhajan|mantra|aarti|arti|shiv|shankar|mahadev|bholenath|krishna|radha|\bram\b|hanuman|mata|devi|durga|kali|santoshi|shani|surya|geeta|गीता|भजन|भक्ति|मंत्र|आरती|शिव|महादेव|भोले|कृष्ण|राधा|राम|हनुमान|माता|देवी|दुर्गा|काली|संतोषी|शनिदेव|सूर्य|जाप|जप|ध्यान", re.I)
          videos=[]
          for e in root.findall("atom:entry", ns):
              title=e.findtext("atom:title", default="", namespaces=ns)
              vid=e.findtext("yt:videoId", default="", namespaces=ns)
              published=e.findtext("atom:published", default="", namespaces=ns)
              if vid and terms.search(title):
                  videos.append({"videoId":vid,"title":html.unescape(title),"url":f"https://www.youtube.com/watch?v={vid}","thumbnail":f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg","published":published[:10]})
              if len(videos)>=12: break
          with open("latest-bhakti.json","w",encoding="utf-8") as f:
              json.dump({"channel":"SunoDk","channelId":channel,"updated":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),"videos":videos},f,ensure_ascii=False,indent=2)
          PY
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-bhakti.json
          git diff --cached --quiet || (git commit -m "Refresh latest SunoDk bhakti feed" && git push)
