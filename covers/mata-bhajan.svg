<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">माता भजन — DkRapria Devotional</title><desc id="desc">भव्य लाल साड़ी में माता रानी, स्वर्ण मुकुट, दिव्य प्रभामंडल, शेर, त्रिशूल और दीपक।</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#71301d"/><stop offset=".48" stop-color="#35101d"/><stop offset="1" stop-color="#100910"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fff9cf"/><stop offset=".28" stop-color="#ffd46b"/><stop offset=".62" stop-color="#e58c27" stop-opacity=".72"/><stop offset="1" stop-color="#b74b18" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2=".1" y2="1"><stop stop-color="#fff8c4"/><stop offset=".28" stop-color="#f6d36c"/><stop offset=".62" stop-color="#d99428"/><stop offset="1" stop-color="#8d4218"/></linearGradient>
 <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6870"/><stop offset=".35" stop-color="#c81737"/><stop offset=".75" stop-color="#810c2c"/><stop offset="1" stop-color="#410b21"/></linearGradient>
 <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#ffe0bd"/><stop offset=".55" stop-color="#e9a77f"/><stop offset="1" stop-color="#b96a51"/></linearGradient>
 <linearGradient id="mane" x2="1" y2="1"><stop stop-color="#ffdb7b"/><stop offset=".5" stop-color="#b96a23"/><stop offset="1" stop-color="#713016"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
